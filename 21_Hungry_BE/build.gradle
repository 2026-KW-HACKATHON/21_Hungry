plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kw'
version = '0.0.1-SNAPSHOT'
description = '21_Hungry_BE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    implementation 'nl.martijndwars:web-push:5.1.2'
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = '21-hungry-be.jar'
}

// Explicit opt-in; not part of test/check and never starts Spring, a database or a worker.
tasks.register('summaryEval', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kw.knowone.encounter.processing.SummaryEvaluationMain'
    args providers.gradleProperty('evalSet').getOrElse('development'),
         providers.gradleProperty('evalPrompt').getOrElse('1.1'),
         providers.gradleProperty('evalLive').getOrElse('false')
}

tasks.register('summaryEvidenceAudit', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kw.knowone.encounter.processing.SavedEvidenceAuditMain'
}

tasks.register('summaryEvidenceEval', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kw.knowone.encounter.processing.SummaryEvidenceEvaluationMain'
    args providers.gradleProperty('evalSet').getOrElse('public-development'),
         providers.gradleProperty('evalPrompt').getOrElse('1.5'),
         providers.gradleProperty('evalLive').getOrElse('false'),
         providers.gradleProperty('evalCampaign').getOrElse('evidence-linking'),
         providers.gradleProperty('evalModel').getOrElse('mini'),
         providers.gradleProperty('evalCase').getOrElse('')
}

tasks.register('summaryEvidenceReport', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kw.knowone.encounter.processing.EvidenceEvaluationReportMain'
    args providers.gradleProperty('evalCampaign').getOrElse('evidence-linking')
}
