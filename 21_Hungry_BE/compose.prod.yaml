services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hungry
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - hungry-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:?API_IMAGE immutable tag or digest is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      FILE_STORAGE_ROOT: /data/private-files
      PREVIEW_SIGNING_SECRET: ${PREVIEW_SIGNING_SECRET:?PREVIEW_SIGNING_SECRET is required}
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}
      OPENAI_OCR_MODEL: ${OPENAI_OCR_MODEL:-gpt-5.4-mini-2026-03-17}
      OPENAI_ANALYSIS_MODEL: ${OPENAI_ANALYSIS_MODEL:-gpt-5.4-mini-2026-03-17}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-90s}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-12000}
      AI_WORKER_ENABLED: ${AI_WORKER_ENABLED:-false}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
      AI_JOB_LEASE_SECONDS: ${AI_JOB_LEASE_SECONDS:-180}
      AI_JOB_MAX_ATTEMPTS: ${AI_JOB_MAX_ATTEMPTS:-4}
      AUDIO_ALLOWED_MEDIA_TYPES: ${AUDIO_ALLOWED_MEDIA_TYPES:-audio/wav,audio/x-wav}
      AUDIO_MAX_BYTES: ${AUDIO_MAX_BYTES:-25000000}
      AUDIO_MAX_DURATION_SECONDS: ${AUDIO_MAX_DURATION_SECONDS:-1200}
      MULTIPART_MAX_REQUEST_BYTES: ${MULTIPART_MAX_REQUEST_BYTES:-120MB}
      NOTIFICATION_EVENT_WORKER_ENABLED: ${NOTIFICATION_EVENT_WORKER_ENABLED:-false}
      PUSH_WORKER_ENABLED: ${PUSH_WORKER_ENABLED:-false}
      NOTIFICATION_WORKER_CONCURRENCY: ${NOTIFICATION_WORKER_CONCURRENCY:-2}
      NOTIFICATION_LEASE_SECONDS: ${NOTIFICATION_LEASE_SECONDS:-120}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_POLL_DELAY: ${NOTIFICATION_POLL_DELAY:-2s}
      PUSH_TIMEOUT_SECONDS: ${PUSH_TIMEOUT_SECONDS:-20}
      PUSH_ALLOWED_HOST_SUFFIXES: ${PUSH_ALLOWED_HOST_SUFFIXES:-fcm.googleapis.com,updates.push.services.mozilla.com,web.push.apple.com}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hungry-private-files:/data/private-files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  hungry-postgres-data:
  hungry-private-files:
