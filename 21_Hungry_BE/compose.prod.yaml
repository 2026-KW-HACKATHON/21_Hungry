services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hungry
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - hungry-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT:?FILE_STORAGE_ROOT is required}
      AUDIO_TEMP_ROOT: ${AUDIO_TEMP_ROOT:?AUDIO_TEMP_ROOT is required}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${FILE_STORAGE_ROOT:?FILE_STORAGE_ROOT is required}:${FILE_STORAGE_ROOT:?FILE_STORAGE_ROOT is required}
      - ${AUDIO_TEMP_ROOT:?AUDIO_TEMP_ROOT is required}:${AUDIO_TEMP_ROOT:?AUDIO_TEMP_ROOT is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  hungry-postgres-data:
