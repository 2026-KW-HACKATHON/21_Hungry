services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: hungry
      POSTGRES_USER: hungry
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hungry_local}
      TZ: Asia/Seoul
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hungry -d hungry"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - hungry-postgres-data:/var/lib/postgresql

volumes:
  hungry-postgres-data:
