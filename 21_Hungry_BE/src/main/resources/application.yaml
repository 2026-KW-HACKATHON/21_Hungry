spring:
  application:
    name: 21_Hungry_BE
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: Asia/Seoul
  demo:
    enabled: false
    recipient-lookup-limit-per-minute: 10
  auth:
    session-ttl: "${AUTH_SESSION_TTL_SECONDS:86400}s"
  idempotency:
    ttl: "${IDEMPOTENCY_TTL_SECONDS:86400}s"
  preview:
    ttl: "${PREVIEW_TTL_SECONDS:300}s"
    signing-secret: ${PREVIEW_SIGNING_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
