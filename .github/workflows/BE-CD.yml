name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "21_Hungry_BE/**"
      - ".github/workflows/BE-CD.yml"
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: hungry
          POSTGRES_USER: hungry
          POSTGRES_PASSWORD: hungry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hungry -d hungry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: 21_Hungry_BE/gradle/wrapper/gradle-wrapper.properties

      - name: Verify backend
        working-directory: 21_Hungry_BE
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: "jdbc:postgresql://localhost:5432/hungry?currentSchema=hungry_test"
          DB_USERNAME: hungry
          DB_PASSWORD: hungry_test
          AI_WORKER_ENABLED: "false"
          NOTIFICATION_EVENT_WORKER_ENABLED: "false"
          PUSH_WORKER_ENABLED: "false"
        run: |
          chmod +x ./gradlew
          ./gradlew test bootJar

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "$EC2_HOST" > ~/.ssh/known_hosts \
              && test -s ~/.ssh/known_hosts; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "EC2 SSH host key scan failed after 5 attempts." >&2
              exit 1
            fi

            sleep 5
          done
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=5 \
            -o BatchMode=yes \
            -i ~/.ssh/deploy_key \
            "ec2-user@$EC2_HOST" \
            bash -se -- "/home/ec2-user/21_Hungry" <<'REMOTE'
          set -Eeuo pipefail

          deploy_root="$1"
          test -d "$deploy_root/.git"
          test "$(git -C "$deploy_root" branch --show-current)" = "main"

          git -C "$deploy_root" pull --ff-only origin main
          bash "$deploy_root/21_Hungry_BE/scripts/deploy.sh" \
            "$deploy_root/21_Hungry_BE"
          REMOTE
