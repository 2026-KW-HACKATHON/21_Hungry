name: Backend CI

on:
  push:
    branches-ignore:
      - main
    paths:
      - "21_Hungry_BE/**"
      - ".github/workflows/BE-CI.yml"
  pull_request:
    branches:
      - main
    paths:
      - "21_Hungry_BE/**"
      - ".github/workflows/BE-CI.yml"
  merge_group:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: hungry
          POSTGRES_USER: hungry
          POSTGRES_PASSWORD: hungry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hungry -d hungry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: 21_Hungry_BE
    env:
      DB_URL: jdbc:postgresql://localhost:5432/hungry
      DB_USERNAME: hungry
      DB_PASSWORD: hungry_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Test
        run: ./gradlew --no-daemon test
      - name: Build boot jar
        run: ./gradlew --no-daemon bootJar
